<!doctype html>
<html lang="en" ng-app="trafficApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philippines Traffic Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4" ng-controller="TrafficController as vm">
    <h1 class="mb-3">Real-Time Traffic in the Philippines</h1>
    <p class="text-muted">Select a city to view current traffic conditions using Google Maps Traffic Layer.</p>
    <div class="alert alert-secondary">
      Enter your Google Maps API key to load live traffic data.
    </div>

    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-6">
        <label for="apiKey" class="form-label">Google Maps API Key</label>
        <input id="apiKey" type="password" class="form-control" ng-model="vm.apiKey" placeholder="Enter API key">
      </div>
      <div class="col-md-6">
        <button class="btn btn-primary" type="button" ng-click="vm.loadMap()">Load Traffic Map</button>
      </div>
    </div>

    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-6">
        <label for="citySelect" class="form-label">City</label>
        <select id="citySelect" class="form-select" ng-model="vm.selectedCity" ng-options="city.name for city in vm.cities track by city.name" ng-change="vm.onCityChange()"></select>
      </div>
      <div class="col-md-6">
        <div class="alert alert-info mb-0">
          Showing traffic for <strong>{{ vm.selectedCity.name }}</strong>
        </div>
      </div>
    </div>

    <div id="trafficMap" class="rounded border" style="height: 500px;"></div>
    <p class="text-danger small mt-2 mb-0" ng-if="vm.errorMessage">{{ vm.errorMessage }}</p>
    <p class="text-muted small mt-2 mb-0" ng-if="vm.loading">Loading Google Maps traffic data...</p>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script>
    (function () {
      const app = angular.module('trafficApp', []);

      app.controller('TrafficController', ['$scope', '$window', function ($scope, $window) {
        const vm = this;

        vm.cities = [
          { name: 'Manila', lat: 14.5995, lng: 120.9842, zoom: 12 },
          { name: 'Cebu', lat: 10.3157, lng: 123.8854, zoom: 12 },
          { name: 'Boracay', lat: 11.9674, lng: 121.9248, zoom: 13 },
          { name: 'Palawan', lat: 9.8349, lng: 118.7384, zoom: 9 },
          { name: 'Laguna', lat: 14.2732, lng: 121.4453, zoom: 10 }
        ];

        vm.selectedCity = vm.cities[0];
        vm.apiKey = '';
        vm.mapReady = false;
        vm.loading = false;
        vm.errorMessage = '';
        vm.map = null;
        vm.trafficLayer = null;

        vm.onCityChange = function () {
          if (!vm.map || !vm.selectedCity) {
            return;
          }

          vm.map.setCenter({ lat: vm.selectedCity.lat, lng: vm.selectedCity.lng });
          vm.map.setZoom(vm.selectedCity.zoom);
        };

        vm.loadMap = function () {
          if (!vm.apiKey) {
            vm.errorMessage = 'A Google Maps API key is required to load traffic data.';
            return;
          }

          vm.errorMessage = '';
          vm.loading = true;

          if ($window.google && $window.google.maps) {
            $window.initTrafficMap();
            return;
          }

          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(vm.apiKey) + '&callback=initTrafficMap';
          script.onerror = function () {
            vm.loading = false;
            vm.errorMessage = 'Unable to load Google Maps. Verify your API key and network access.';
            $scope.$applyAsync();
          };

          document.body.appendChild(script);
        };

        $window.initTrafficMap = function () {
          vm.map = new $window.google.maps.Map(document.getElementById('trafficMap'), {
            center: { lat: vm.selectedCity.lat, lng: vm.selectedCity.lng },
            zoom: vm.selectedCity.zoom
          });

          vm.trafficLayer = new $window.google.maps.TrafficLayer();
          vm.trafficLayer.setMap(vm.map);
          vm.loading = false;
          vm.mapReady = true;
          vm.onCityChange();
          $scope.$applyAsync();
        };
      }]);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
